# Project-wide Gradle settings.
# Force English Locale and UTF-8 encoding so KSP and Room code generators on Arabic Windows
# generate ASCII numeric literals (e.g., RoomOpenDelegate(3, ...)) rather than Arabic-Indic numerals (RoomOpenDelegate(٣, ...)).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Duser.variant=

# System properties passed to all Gradle workers and compilation tasks
systemProp.file.encoding=UTF-8
systemProp.user.language=en
systemProp.user.country=US
systemProp.user.variant=
systemProp.sun.jnu.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Set the maximum number of workers to 4 to avoid overloading the machine.
org.gradle.workers.max=4
# Set the Kotlin compiler execution strategy to in-process to avoid connection issues.
kotlin.compiler.execution.strategy=in-process
# Allow the google-services plugin to work even if the google-services.json is not present.
googleServices.missing.passthrough=true

# Version configuration (Single source of truth)
VERSION_CODE=1
VERSION_NAME=1.0.0
